<!-- ფონი გვერდის/ამინდის მიხედვით იცვლება -->
<div class="app" [ngClass]="weatherState.theme">
  <header class="site-header">
    <a routerLink="/" class="brand">🌤️ {{ 'HEADER.BRAND' | translate }}</a>
    <app-location-search class="header-search"></app-location-search>
    <app-language-switcher></app-language-switcher>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    {{ 'FOOTER' | translate }}
    <!-- Open-Meteo-ს ლიცენზია (CC-BY 4.0) წყაროს მითითებას ითხოვს -->
    <p class="data-source">
      {{ 'DATA_SOURCE' | translate }}
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    </p>
  </footer>
</div>
